[project]
name = "ioc-xp-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "alembic==1.14.0",
  "geoalchemy2==0.16.0",
  "pyjwt==2.10.1",
  "argon2-cffi==23.1.0",
  "pyotp==2.9.0",
  "python-multipart==0.0.19",
  "openpyxl==3.1.5",
  "pyyaml==6.0.2",
  "apscheduler==3.11.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.26.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "seeds*"]
