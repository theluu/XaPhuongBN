server {
  listen 80;
  server_tokens off;
  client_max_body_size 20m;
  root /usr/share/nginx/html;

  # Địa chỉ người dùng thật: chỉ tin X-Forwarded-For khi request đến từ reverse proxy tin cậy (Caddy).
  # TRUSTED_PROXY mặc định 127.0.0.1/32 (không tin ai) — môi trường thật đặt dải mạng của Caddy.
  set_real_ip_from ${TRUSTED_PROXY};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.fr https://server.arcgisonline.com https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self'; frame-ancestors 'self'" always;

  location /api/ {
    proxy_pass http://backend:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # ghi đè, không nối tiếp giá trị client tự gửi
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # Không dùng add_header trong location: nginx sẽ bỏ kế thừa các header bảo mật (CSP, X-Frame-Options…) của server
  location /assets/ { expires 30d; }
  location / { try_files $uri /index.html; expires -1; }
}
