# Môi trường thật / staging:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
      MIGRATIONS: alembic
      REQUIRE_2FA: "true"
    command: ["./start.sh", "--workers", "4"]
  frontend:
    restart: unless-stopped
    environment:
      TRUSTED_PROXY: "10.89.0.1/32"   # Caddy trên máy chủ đi vào qua gateway của mạng internal
    ports: !override ["127.0.0.1:6680:80"]   # chỉ mở cho reverse proxy (Caddy) trên cùng máy
