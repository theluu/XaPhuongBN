name: ioc-xp
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ioc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ioc}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ioc}"]
      interval: 5s
      retries: 20
    networks: [internal]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ioc_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-ioc}
      ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ioc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ioc}
      STORAGE_DIR: /data/storage
    volumes: [filestore:/data/storage]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/api/health',timeout=3)"]
      interval: 5s
      retries: 30
      start_period: 10s
    networks: [internal]
  frontend:
    build: ./frontend
    ports: ["6680:80"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]
volumes: {pgdata: {}, filestore: {}}
networks: {internal: {}}
